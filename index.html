<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YUZI AI Ultimate+</title>
<style>
/* Font & warna */
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Roboto&display=swap');

:root{
  --primary:#007bff;
  --bg-dark:#121212;
  --bg-light:#f0f0f0;
  --user-dark:#0a84ff;
  --ai-dark:#1f1f1f;
  --ai-light:#ddd;
}
body{margin:0;padding:0;font-family:'Roboto',sans-serif;display:flex;flex-direction:column;height:100vh;background:var(--bg-dark);color:#fff;transition:0.3s;}
body.light{background:var(--bg-light);color:#000;}
header{display:flex;align-items:center;padding:15px;gap:15px;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);}
body.light header{background:rgba(255,255,255,0.6);}
header img{height:50px;width:50px;border-radius:50%;border:2px solid var(--primary);animation:spin 20s linear infinite;}
@keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
header h1{font-family:'Orbitron',sans-serif;font-size:1.8em;color:var(--primary);margin:0;}
#chat{flex:1;padding:15px;overflow-y:auto;display:flex;flex-direction:column;scrollbar-width:none;}
#chat::-webkit-scrollbar{display:none;}
.msg{margin:5px 0;padding:10px 15px;border-radius:20px;max-width:75%;word-wrap:break-word;font-size:0.95em;line-height:1.4em;opacity:0;transform:translateY(20px);animation:fadeInUp 0.3s forwards;transition:0.3s;}
@keyframes fadeInUp{to{opacity:1;transform:translateY(0);}}
.user{align-self:flex-end;border-bottom-right-radius:0;background:linear-gradient(45deg,var(--user-dark),#0d6efd);color:#fff;box-shadow:0 4px 8px rgba(0,0,0,0.3);}
.ai{align-self:flex-start;border-bottom-left-radius:0;background:var(--ai-dark);color:#fff;box-shadow:0 4px 8px rgba(0,0,0,0.3);}
body.light .ai{background:var(--ai-light);color:#000;}
.typing{font-style:italic;color:#aaa;margin:5px 0;}
.input-area{display:flex;padding:10px;gap:8px;backdrop-filter:blur(8px);background:rgba(0,0,0,0.5);}
body.light .input-area{background:rgba(255,255,255,0.5);}
#input{flex:1;padding:10px 15px;border-radius:25px;border:none;outline:none;font-size:1em;background:rgba(255,255,255,0.1);color:inherit;}
body.light #input{background:rgba(0,0,0,0.05);color:#000;}
#sendBtn{padding:10px 20px;border:none;border-radius:25px;background:var(--primary);color:#fff;font-weight:bold;cursor:pointer;transition:0.3s;}
#sendBtn:hover{background:#0056b3;transform:scale(1.05);}
#toggleTheme{padding:10px 15px;border:none;border-radius:25px;background:#888;color:#fff;cursor:pointer;transition:0.3s;}
#toggleTheme:hover{background:#555;}
img.generated{max-width:100%;border-radius:15px;margin-top:10px;border:2px solid var(--primary);box-shadow:0 5px 15px rgba(0,0,0,0.5);}
</style>
</head>
<body>
<header>
  <img src="https://upload.wikimedia.org/wikipedia/commons/0/04/ChatGPT_logo.svg" alt="YUZI Logo">
  <h1>YUZI AI Ultimate+</h1>
</header>

<div id="chat"></div>

<div class="input-area">
  <input id="input" placeholder="Tanya apa saja ke YUZI...">
  <button id="sendBtn">Kirim</button>
  <button id="toggleTheme" title="Toggle Light/Dark">🌗</button>
</div>

<audio id="typeSound" src="https://freesound.org/data/previews/64/64588_634166-lq.mp3" preload="auto"></audio>

<script src="brain.js"></script>
<script>
const chat=document.getElementById("chat");
const input=document.getElementById("input");
const sendBtn=document.getElementById("sendBtn");
const typeSound=document.getElementById("typeSound");
const toggleTheme=document.getElementById("toggleTheme");

let memory=JSON.parse(localStorage.getItem("yuzi_memory"))||[];
function saveMemory(){ localStorage.setItem("yuzi_memory",JSON.stringify(memory)); }

function addMsg(text,type){const div=document.createElement("div");div.className="msg "+type;div.innerText=text;chat.appendChild(div);chat.scrollTop=chat.scrollHeight;typeSound.play().catch(()=>{});}
let typingElem;
function typing(show){if(show){if(!typingElem){typingElem=document.createElement("div");typingElem.className="typing";typingElem.innerText="YUZI sedang berpikir...";chat.appendChild(typingElem);}}else if(typingElem){typingElem.remove();typingElem=null;}}

async function generateImage(prompt){return "⚠️ Fitur gambar offline, bisa ditambahkan dengan API.";}

// Kirim pesan
async function send(){
  const text=input.value.trim(); if(!text) return;
  addMsg(text,"user"); memory.push({type:"user",text}); saveMemory(); input.value="";
  if(text==="/clear"){chat.innerHTML="";memory=[];localStorage.removeItem("yuzi_memory");addMsg("🧹 Chat dibersihkan.","ai"); return;}
  if(text.startsWith("/image ")){typing(true);const r=await generateImage(text.replace("/image ",""));typing(false);addMsg(r,"ai");memory.push({type:"ai",text:r});saveMemory();return;}
  typing(true);let reply;try{reply=yuziBrain.getReply(text,memory);}catch(e){console.error(e);reply="Aku masih belajar, tapi aku YUZI AI 🤓 Maha Tau 😎.";}
  typing(false);addMsg(reply,"ai");memory.push({type:"ai",text:reply});saveMemory();
}

sendBtn.onclick=send;
input.addEventListener("keydown",e=>e.key==="Enter"&&send());
toggleTheme.onclick=()=>{document.body.classList.toggle("light");}

function autoMode(){const h=new Date().getHours();if(!document.body.classList.contains("light")){document.body.className=(h>=7&&h<19)?"light":"dark";}}
autoMode();setInterval(autoMode,60000);

// Load memory
memory.forEach(m=>addMsg(m.text,m.type));
addMsg("🤓 Aku adalah YUZI AI Ultimate+ Offline! Cepat, ringan, mengerti topik, tahu penciptanya. Ketik /clear untuk hapus chat.","ai");
</script>
</body>
</html>
