<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YUZI AI Ultimate+ Simple</title>
<style>
body{margin:0;padding:0;font-family:sans-serif;display:flex;flex-direction:column;height:100vh;background:#121212;color:#fff;transition:0.3s;}
body.light{background:#f0f0f0;color:#000;}
header{display:flex;align-items:center;padding:10px;gap:10px;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);}
body.light header{background:rgba(255,255,255,0.6);}
header img{height:50px;width:50px;border-radius:50%;border:2px solid #007bff;}
header h1{margin:0;color:#007bff;}
#chat{flex:1;padding:10px;overflow-y:auto;display:flex;flex-direction:column;}
.msg{margin:5px 0;padding:10px 15px;border-radius:20px;max-width:75%;word-wrap:break-word;opacity:0;transform:translateY(20px);animation:fadeInUp 0.3s forwards;}
@keyframes fadeInUp{to{opacity:1;transform:translateY(0);}}
.user{align-self:flex-end;background:#0d6efd;color:#fff;border-bottom-right-radius:0;}
.ai{align-self:flex-start;background:#1f1f1f;color:#fff;border-bottom-left-radius:0;}
body.light .ai{background:#ddd;color:#000;}
.typing{font-style:italic;color:#aaa;margin:5px 0;}
.input-area{display:flex;padding:8px;gap:5px;background:rgba(0,0,0,0.5);backdrop-filter:blur(8px);}
body.light .input-area{background:rgba(255,255,255,0.5);}
#input{flex:1;padding:8px 12px;border-radius:25px;border:none;outline:none;background:rgba(255,255,255,0.1);color:inherit;}
body.light #input{background:rgba(0,0,0,0.05);}
button{padding:8px 15px;border:none;border-radius:25px;font-weight:bold;cursor:pointer;transition:0.3s;}
#sendBtn{background:#007bff;color:#fff;}
#sendBtn:hover{background:#0056b3;}
#toggleTheme{background:#888;color:#fff;}
#toggleTheme:hover{background:#555;}
</style>
</head>
<body>
<header>
<img src="https://upload.wikimedia.org/wikipedia/commons/0/04/ChatGPT_logo.svg" alt="Logo">
<h1>YUZI AI Ultimate+</h1>
</header>

<div id="chat"></div>

<div class="input-area">
<input id="input" placeholder="Tanya apa saja ke YUZI...">
<button id="sendBtn">Kirim</button>
<button id="toggleTheme">🌗</button>
</div>

<audio id="typeSound" src="https://freesound.org/data/previews/64/64588_634166-lq.mp3" preload="auto"></audio>

<script>
// ===== Brain Offline =====
const memoryContext=20;
const randomChoice=arr=>arr[Math.floor(Math.random()*arr.length)];
const knowledge={
  sains:["Fisika: Hukum Newton menjelaskan gerak benda.","Kimia: Reaksi kimia melibatkan perubahan zat.","Biologi: Sel adalah unit dasar kehidupan.","Matematika: Rumus Pythagoras a²+b²=c²","AI: AI membantu pekerjaan tapi perlu data jelas."],
  sejarah:["Revolusi Industri mengubah dunia.","Albert Einstein menemukan teori relativitas.","Perang Dunia II 1939-1945.","Listrik oleh Faraday & Tesla."],
  teknologi:["CPU adalah otak komputer.","Internet menghubungkan jutaan perangkat.","Blockchain: ledger terdesentralisasi."],
  humor:["Kenapa komputer tidak bisa tidur? Karena selalu standby!","AI suka kopi karena bisa debug sambil ngopi!","Algoritma juga butuh hiburan!"],
  tips:["Bagi masalah jadi langkah kecil, kerjakan satu per satu.","Konsistensi adalah kunci belajar skill baru.","Catat progres dan evaluasi hasil setiap hari."],
  perasaan:["Dengarkan hati, komunikasikan jujur.","Empati dan perhatian membuat ikatan lebih kuat.","Fokus ke solusi daripada menyalahkan."]
};
function yuziBrain(msg,memory){
  const lastUser=memory.filter(m=>m.type==="user").slice(-memoryContext).map(m=>m.text);
  msg=msg.trim().toLowerCase();
  if(/siapa (membuat|mencipta|pencipta|pembuatmu)/.test(msg)) return "Aku diciptakan oleh DIMAS AZKA 🤓 Maha Tau!";
  if(/halo|hai|hi|selamat pagi|selamat siang|selamat malam/.test(msg)) return randomChoice(["Halo! Aku YUZI AI 🤓","Hai! Aku YUZI AI 🤓","Salam! Aku YUZI AI 🤓"]);
  if(/joke|lucu|humor|ngakak/.test(msg)) return randomChoice(knowledge.humor);
  if(/tips|trik|cara|tutorial/.test(msg)) return randomChoice(knowledge.tips);
  if(/cinta|suka|sayang|teman|pacar/.test(msg)) return randomChoice(knowledge.perasaan);
  if(/fizik|kimia|biologi|matematika|ilmu|teknologi|AI|komputer/.test(msg)) return randomChoice([...knowledge.sains,...knowledge.teknologi]);
  if(/sejarah|tahun|perang|penemuan|tokoh|bangsa/.test(msg)) return randomChoice(knowledge.sejarah);
  if(msg.startsWith("apa ")) return `🤓 Jawaban: "${msg}"\nLangkah-langkah: ...\n${lastUser.length?`Konteks: ${lastUser.join("; ")}`:""}`;
  if(msg.startsWith("siapa ")) return `🤓 Jawaban: "${msg}"\nIdentitas/deskripsi: ...`;
  if(msg.startsWith("dimana ")) return `🤓 Jawaban: Lokasi terkait: ...`;
  if(msg.startsWith("kapan ")) return `🤓 Jawaban: Waktu/tanggal: ...`;
  if(/^(mengapa|kenapa)/.test(msg)) return `🤓 Jawaban: Sebab-akibat: ...`;
  if(msg.startsWith("bagaimana ")) return `🤓 Jawaban: Langkah-langkah: ...`;
  return `Aku mendengar: "${msg}".\nAku YUZI AI 🤓 Maha Tau.\n${lastUser.length?`Referensi: ${lastUser.join("; ")}`:""}`;
}

// ===== UI =====
const chat=document.getElementById("chat");
const input=document.getElementById("input");
const sendBtn=document.getElementById("sendBtn");
const toggleTheme=document.getElementById("toggleTheme");
const typeSound=document.getElementById("typeSound");
let memory=JSON.parse(localStorage.getItem("yuzi_memory"))||[];
function saveMemory(){localStorage.setItem("yuzi_memory",JSON.stringify(memory));}
function addMsg(text,type){
  const div=document.createElement("div");
  div.className="msg "+type;
  div.innerText=text;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
  typeSound.play().catch(()=>{});
}
let typingElem;
function typing(show){if(show){if(!typingElem){typingElem=document.createElement("div");typingElem.className="typing";typingElem.innerText="YUZI sedang berpikir...";chat.appendChild(typingElem);}}else if(typingElem){typingElem.remove();typingElem=null;}}

// ===== Send Message =====
async function send(){
  const text=input.value.trim(); if(!text) return;
  addMsg(text,"user"); memory.push({type:"user",text}); saveMemory(); input.value="";
  if(text==="/clear"){chat.innerHTML="";memory=[];localStorage.removeItem("yuzi_memory");return addMsg("🧹 Chat dibersihkan.","ai");}
  typing(true); let reply; try{reply=yuziBrain(text,memory);}catch(e){reply="Aku masih belajar 😎";}
  typing(false); addMsg(reply,"ai"); memory.push({type:"ai",text:reply}); saveMemory();
}
sendBtn.onclick=send; input.addEventListener("keydown",e=>e.key==="Enter" && send());

// ===== Theme Auto =====
toggleTheme.onclick=()=>document.body.classList.toggle("light");
function autoMode(){const h=new Date().getHours();if(!document.body.classList.contains("light")){document.body.className=(h>=7&&h<19)?"light":"dark";}} autoMode(); setInterval(autoMode,60000);

// Load memory
memory.forEach(m=>addMsg(m.text,m.type));
addMsg("🤓 Aku YUZI AI Ultimate+ Simple! Ketik /clear untuk hapus chat.","ai");
</script>
</body>
</html>
